quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${ASTROVAULT_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
quarkus.http.cors.access-control-allow-credentials=true
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/astrovault}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:astrovault}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:astrovault}
quarkus.hibernate-orm.database.generation=none
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml
quarkus.smallrye-openapi.path=/openapi

mp.jwt.verify.issuer=astrovault
smallrye.jwt.sign.key.location=jwt/privateKey.pem
mp.jwt.verify.publickey.location=jwt/publicKey.pem
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=astrovault_token
smallrye.jwt.always-check-authorization=true

quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.metrics.enabled=false

quarkus.http.auth.permission.public.paths=/api/auth/login,/api/auth/logout,/q/health,/q/metrics,/openapi
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.preview.paths=/api/frames/*/preview
quarkus.http.auth.permission.preview.policy=permit
quarkus.http.auth.permission.internal.paths=/internal/worker/*
quarkus.http.auth.permission.internal.policy=permit
quarkus.http.auth.permission.authenticated.paths=/api/*
quarkus.http.auth.permission.authenticated.policy=authenticated

astrovault.storage.mode=${ASTROVAULT_STORAGE_MODE:filesystem}
astrovault.queue.mode=${ASTROVAULT_QUEUE_MODE:inprocess}
astrovault.storage.base-path=${ASTROVAULT_STORAGE_BASE_PATH:data}
astrovault.minio.endpoint=${ASTROVAULT_MINIO_ENDPOINT:http://localhost:9000}
astrovault.minio.access-key=${ASTROVAULT_MINIO_ACCESS_KEY:astrovault}
astrovault.minio.secret-key=${ASTROVAULT_MINIO_SECRET_KEY:astrovault123}
astrovault.rabbitmq.host=${ASTROVAULT_RABBITMQ_HOST:localhost}
astrovault.jobs.running-timeout-minutes=${ASTROVAULT_JOBS_RUNNING_TIMEOUT_MINUTES:10}
astrovault.ingest.path=${ASTROVAULT_INGEST_PATH:/data/ingest}
astrovault.ingest.sources=${ASTROVAULT_INGEST_SOURCES:default|LOCAL_FOLDER|/data/ingest|true}
astrovault.ingest.file-stable-seconds=${ASTROVAULT_INGEST_FILE_STABLE_SECONDS:20}
astrovault.session.gap-hours=${ASTROVAULT_SESSION_GAP_HOURS:4}
astrovault.session.night-rollover-hour=${ASTROVAULT_SESSION_NIGHT_ROLLOVER_HOUR:12}
astrovault.worker.token=${ASTROVAULT_WORKER_TOKEN:worker-token-dev}
astrovault.auth.admin.password=${ASTROVAULT_AUTH_ADMIN_PASSWORD:admin}
astrovault.auth.user.password=${ASTROVAULT_AUTH_USER_PASSWORD:user}
astrovault.auth.viewer.password=${ASTROVAULT_AUTH_VIEWER_PASSWORD:viewer}
