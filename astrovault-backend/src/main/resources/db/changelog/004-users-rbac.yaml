databaseChangeLog:
  - changeSet:
      id: 004-users-rbac
      author: astrovault
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: app_user
      changes:
        - createTable:
            tableName: app_user
            columns:
              - column: { name: id, type: BIGINT, constraints: { primaryKey: true, nullable: false } }
              - column: { name: username, type: VARCHAR(255), constraints: { nullable: false, unique: true } }
              - column: { name: displayName, type: VARCHAR(255) }
              - column: { name: email, type: VARCHAR(255) }
              - column: { name: passwordHash, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: enabled, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: createdAt, type: TIMESTAMP }
        - createSequence:
            sequenceName: app_user_SEQ
            startValue: 1
            incrementBy: 50
        - createTable:
            tableName: app_user_roles
            columns:
              - column: { name: user_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: roles, type: VARCHAR(64), constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: app_user_roles
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_user_roles_user
