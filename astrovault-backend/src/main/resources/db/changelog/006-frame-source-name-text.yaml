databaseChangeLog:
  - changeSet:
      id: 006-frame-source-name-text
      author: astrovault
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: "1"
            sql: "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'frame'"
      changes:
        - sql:
            sql: "ALTER TABLE frame ALTER COLUMN sourcename TYPE TEXT"
