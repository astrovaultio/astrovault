databaseChangeLog:
  - changeSet:
      id: 005-session-manual-workflow-status
      author: astrovault
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 1
            sql: SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = current_schema() AND table_name = 'imagingsession'
      changes:
        - sql:
            sql: ALTER TABLE imagingsession ADD COLUMN IF NOT EXISTS manualworkflowstatus VARCHAR(64)
