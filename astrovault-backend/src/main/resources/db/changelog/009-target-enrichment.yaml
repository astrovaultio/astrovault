databaseChangeLog:
  - changeSet:
      id: 009-target-enrichment
      author: astrovault
      changes:
        - createSequence: { sequenceName: targetenrichment_seq, startValue: 1, incrementBy: 50 }
        - createTable:
            tableName: targetenrichment
            columns:
              - column: { name: id, type: BIGINT, constraints: { primaryKey: true, nullable: false } }
              - column: { name: target_id, type: BIGINT, constraints: { nullable: false, unique: true } }
              - column: { name: canonicalname, type: VARCHAR(255) }
              - column: { name: objecttype, type: VARCHAR(255) }
              - column: { name: catalogids, type: TEXT }
              - column: { name: constellation, type: VARCHAR(255) }
              - column: { name: ra, type: DOUBLE }
              - column: { name: dec, type: DOUBLE }
              - column: { name: magnitude, type: DOUBLE }
              - column: { name: apparentsize, type: VARCHAR(255) }
              - column: { name: distance, type: VARCHAR(255) }
              - column: { name: description, type: TEXT }
              - column: { name: source, type: VARCHAR(255) }
              - column: { name: sourcereference, type: TEXT }
              - column: { name: lastupdated, type: TIMESTAMP }
        - addForeignKeyConstraint:
            baseTableName: targetenrichment
            baseColumnNames: target_id
            referencedTableName: target
            referencedColumnNames: id
            constraintName: fk_target_enrichment_target
        - addColumn:
            tableName: processingjob
            columns:
              - column: { name: targetid, type: BIGINT }
