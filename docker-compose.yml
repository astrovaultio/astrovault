version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: astrovault
      POSTGRES_PASSWORD: astrovault
      POSTGRES_DB: astrovault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: astrovault
      MINIO_ROOT_PASSWORD: astrovault123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./astrovault-backend
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/astrovault
      QUARKUS_DATASOURCE_USERNAME: astrovault
      QUARKUS_DATASOURCE_PASSWORD: astrovault
      ASTROVAULT_STORAGE_MODE: minio
      ASTROVAULT_QUEUE_MODE: rabbitmq
      ASTROVAULT_MINIO_ENDPOINT: http://minio:9000
      ASTROVAULT_MINIO_ACCESS_KEY: astrovault
      ASTROVAULT_MINIO_SECRET_KEY: astrovault123
      ASTROVAULT_RABBITMQ_HOST: rabbitmq
      ASTROVAULT_JOBS_RUNNING_TIMEOUT_MINUTES: 10
      ASTROVAULT_INGEST_PATH: /data/ingest
      ASTROVAULT_WORKER_TOKEN: worker-token-dev
      ASTROVAULT_JWT_SECRET: astrovault-dev-secret-change-me
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - rabbitmq
      - minio
    volumes:
      - ./ingest:/data/ingest

  worker:
    build:
      context: ./astrovault-worker
    environment:
      ASTROVAULT_RABBITMQ_HOST: rabbitmq
      ASTROVAULT_BACKEND_URL: http://backend:8080
      ASTROVAULT_WORKER_TOKEN: worker-token-dev
      ASTROVAULT_MINIO_ENDPOINT: minio:9000
      ASTROVAULT_MINIO_ACCESS_KEY: astrovault
      ASTROVAULT_MINIO_SECRET_KEY: astrovault123
    depends_on:
      - backend
      - rabbitmq
      - minio

  frontend:
    build:
      context: ./astrovault-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  asiair-ingest-worker:
    profiles: ["asiair"]
    build:
      context: ./astrovault-ingest-worker
    environment:
      ASTROVAULT_BACKEND_URL: http://backend:8080
      ASTROVAULT_WORKER_TOKEN: worker-token-dev
      ASTROVAULT_MINIO_ENDPOINT: minio:9000
      ASTROVAULT_MINIO_ACCESS_KEY: astrovault
      ASTROVAULT_MINIO_SECRET_KEY: astrovault123
      ASIAIR_ENABLED: true
      ASIAIR_HOST: "192.168.90.9"
      ASIAIR_SHARE: "EMMC Images"
      ASIAIR_USERNAME: "guest"
      ASIAIR_PASSWORD: ${ASIAIR_PASSWORD:-}
      ASIAIR_BASE_PATH: ${ASIAIR_BASE_PATH:-/}
      ASIAIR_SMB_REQUIRE_SIGNING: ${ASIAIR_SMB_REQUIRE_SIGNING:-false}
      ASIAIR_SMB_REQUIRE_SECURE_NEGOTIATE: ${ASIAIR_SMB_REQUIRE_SECURE_NEGOTIATE:-false}
      ASIAIR_POLL_INTERVAL_SECONDS: ${ASIAIR_POLL_INTERVAL_SECONDS:-600}
      ASIAIR_FILE_STABLE_SECONDS: ${ASIAIR_FILE_STABLE_SECONDS:-20}
      ASIAIR_MAX_SCAN_DEPTH: ${ASIAIR_MAX_SCAN_DEPTH:-8}
    depends_on:
      - backend
      - minio

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
