quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:astrovault;MODE=PostgreSQL;DB_CLOSE_DELAY=0
quarkus.datasource.username=sa
quarkus.datasource.password=sa

quarkus.hibernate-orm.database.generation=none
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml

quarkus.otel.metrics.enabled=false
quarkus.otel.traces.enabled=false

astrovault.auth.admin.password=admin
astrovault.auth.user.password=user
astrovault.auth.viewer.password=viewer
