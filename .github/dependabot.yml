version: 2

updates:
  - package-ecosystem: maven
    directory: /astrovault-backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /astrovault-frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /astrovault-worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /astrovault-ingest-worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /astrovault-backend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /astrovault-frontend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /astrovault-worker
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /astrovault-ingest-worker
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
